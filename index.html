<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exsited knowledge base articles</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f4f7;
    --ink: #18222e;
    --muted: #5a6776;
    --panel: #ffffff;
    --line: #d5dce4;
    --accent: #f47521;
    --accent-ink: #b8501a;
    --done: #3f8f99;
    --done-soft: #e3f1f2;
    --warn-soft: #fff1e6;
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 18px 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { display: block; height: 26px; width: auto; }
  .top h1 {
    margin: 0;
    padding-left: 16px;
    border-left: 1px solid var(--line);
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
  }
  .top p { margin: 0; color: var(--muted); font-size: 14px; }
  .top code { font-size: 13px; color: var(--ink); }

  .notice {
    margin: 0;
    padding: 12px 32px;
    background: var(--warn-soft);
    border-bottom: 1px solid #f4c9aa;
    font-size: 14px;
  }
  .notice strong { color: var(--accent-ink); }

  .desk { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 64px); }

  .list { border-right: 1px solid var(--line); padding: 24px 16px; }
  .search {
    width: 100%;
    margin: 0 0 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
  }
  .list h2 { margin: 16px 12px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .list ul { list-style: none; margin: 0; padding: 0; }
  .list button {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 8px;
    width: 100%;
    margin: 0 0 4px;
    padding: 11px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .list button:hover { background: #e8ecf1; }
  .list button[aria-current="true"] { background: var(--panel); border-color: var(--line); }
  .list .name { font-weight: 600; line-height: 1.35; }
  .list .kind { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .list .tick { width: 18px; height: 18px; color: var(--done); visibility: hidden; margin-top: 2px; }
  .list button.copied .tick { visibility: visible; }
  .empty { margin: 8px 12px; color: var(--muted); font-size: 14px; }

  .work { padding: 28px 40px 64px; max-width: 1180px; }
  .head h2 { margin: 0 0 18px; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }

  .fields { display: grid; gap: 10px; margin: 0 0 24px; }
  .field {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
    padding: 10px 12px 10px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .field dt { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .field .meta { color: var(--muted); font-weight: 400; font-size: 14px; }

  .copy {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .copy:hover { border-color: var(--muted); }
  .copy svg { width: 16px; height: 16px; }
  .copy.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .copy.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .copy.done { background: var(--done); border-color: var(--done); color: #fff; }

  .steps {
    counter-reset: step;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 28px;
    padding: 0;
  }
  .steps li {
    counter-increment: step;
    position: relative;
    padding: 12px 14px 12px 48px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 12px;
    top: 11px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    display: grid;
    place-items: center;
  }
  .status { min-height: 22px; margin: -18px 0 12px; font-weight: 600; color: var(--done); font-size: 14px; }

  .frame { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .frame .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  .view { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .view button { padding: 4px 12px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .view button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .frame iframe { display: block; width: 100%; min-height: 600px; border: 0; }
  .code {
    display: none;
    margin: 0;
    padding: 20px 24px;
    max-height: 760px;
    overflow: auto;
    background: #1f2d3d;
    color: #e6edf3;
    font: 13px/1.55 Consolas, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .frame.source .code { display: block; }
  .frame.source iframe { display: none; }
  textarea.clip { position: absolute; left: -9999px; top: 0; }

  @media (max-width: 900px) {
    .desk { grid-template-columns: 1fr; }
    .list { border-right: 0; border-bottom: 1px solid var(--line); }
    .work { padding: 24px 20px 48px; }
    .steps { grid-template-columns: 1fr; }
    .field { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .copy { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="assets/exsited-logo.svg" alt="Exsited" width="154" height="35">
    <h1>Knowledge base articles</h1>
  </div>
  <p>Links point to <code id="base"></code></p>
</header>
<p class="notice" id="placeholder" hidden><strong>Links point at a placeholder address.</strong> Set <code>mintlify_base</code> in <code>config.json</code> to the live documentation address and rebuild before pasting.</p>

<main class="desk">
  <nav class="list" aria-label="Articles">
    <input class="search" id="search" type="search" placeholder="Search articles" aria-label="Search articles">
    <h2>Category</h2>
    <ul id="category-list"></ul>
    <h2 id="count"></h2>
    <ul id="articles"></ul>
    <p class="empty" id="empty" hidden>No article matches. Try a shorter word.</p>
  </nav>

  <section class="work" aria-live="polite">
    <div class="head"><h2 id="title"></h2></div>
    <dl class="fields" id="fields"></dl>
    <ol class="steps" id="steps"></ol>
    <p class="status" id="status" role="status"></p>

    <div class="frame" id="frame">
      <div class="bar">
        <div class="view" role="group" aria-label="View">
          <button type="button" id="view-preview" aria-pressed="true">Knowledge base preview</button>
          <button type="button" id="view-source" aria-pressed="false">HTML</button>
        </div>
        <span>How it will look in the HubSpot knowledge base</span>
      </div>
      <iframe id="preview" title="Knowledge base preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      <pre class="code" id="code"></pre>
    </div>
    <textarea class="clip" id="clip" aria-hidden="true" tabindex="-1"></textarea>
  </section>
</main>

<script id="data" type="application/json">{"base": "https://exsited.mintlify.app", "placeholder": false, "category": {"name": "Exsited API", "description": "Technical documentation to connect your software to Exsited"}, "articles": [{"file": "01-exsited-api.html", "title": "Getting started with the Exsited API", "subtitle": "Connect your software to Exsited with the API or one of seven SDKs", "summary": "What the API is, which tools you can use with it, and where the full documentation is.", "html": "<p style=\"margin: 0 0 16px;\">The Exsited API lets your own software read and change your Exsited data: accounts, orders, invoices, payments, items, purchasing, work and settings. This article explains what the API is, which tools you can use with it, and where to find the full developer documentation.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/introduction\" style=\"font-weight: 700;\">Open the developer documentation<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Who this is for<\/h2>\n\n<p style=\"margin: 0 0 16px;\">The API is for developers building an integration with Exsited, for example creating accounts from a sign-up form, syncing orders and invoices with another system, or reading payments into a reporting tool. You do not need the API to use Exsited day to day; the same work can be done in the Exsited app.<\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Two ways to use it<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Option<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Best for<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>An SDK<\/strong><br><span style=\"font-size: 0.9em; margin: 0 0 16px;\">Python, JavaScript, PHP, Java, .NET, Dart or Go<\/span><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Most integrations. The SDK gets and renews the access token for you, sends your request body as JSON and gives you the JSON response back. The functions are the same in all seven languages.<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>The REST API directly<\/strong><br><span style=\"font-size: 0.9em; margin: 0 0 16px;\">Any language, or cURL<\/span><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">A language without an SDK, or a quick one-off call. You request an access token yourself and send it with each request.<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">What you can work with<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Area<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">What you can do<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/accounts\">Accounts<\/a><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Create and manage customers and suppliers, their contacts, groups and messages<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/orders\">Sales<\/a><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Take orders, bill for them and record the money that comes in or goes back<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/items\">Items and fulfilment<\/a><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Manage what you sell and buy, the stock behind it and how it is shipped and returned<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/purchase-orders\">Purchasing<\/a><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Order from suppliers, record their bills and pay them<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/labours\">Work and people<\/a><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Manage the people you book, the work they do and the time they spend<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Get started<\/h2>\n\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">1<\/span><strong>Get your API credentials.<\/strong> You need your API base URL, client ID, client secret and redirect URI. Your Exsited contact can provide them. <a href=\"https://exsited.mintlify.app/authentication\">Authentication<\/a> explains each one.<\/p>\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">2<\/span><strong>Install the SDK for your language.<\/strong> See <a href=\"https://exsited.mintlify.app/installation\">Installation<\/a>.<\/p>\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">3<\/span><strong>Make your first call.<\/strong> <a href=\"https://exsited.mintlify.app/authentication\">Authentication<\/a> shows how to set up a client in every language, and every endpoint page shows the call in all seven SDKs and cURL.<\/p>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Keep your credentials private<\/p>\n  <p style=\"margin: 0;\">The client secret gives access to your Exsited data through the API. Keep it in an environment variable or a secrets manager, never in source code or a shared document.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">One running app per set of credentials<\/p>\n  <p style=\"margin: 0;\">A new access token for the same credentials ends the previous one. If two apps share one set of credentials, they keep signing each other out. Give each app its own credentials.<\/p>\n<\/div>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Installing the Exsited SDKs<\/li>\n<\/ul>\n", "size": 6630}, {"file": "02-installing-the-sdks.html", "title": "Installing the Exsited SDKs", "subtitle": "What each SDK needs, and how to add it to your project", "summary": "What each SDK needs, how installation works, and fixes for common problems.", "html": "<p style=\"margin: 0 0 16px;\">The Python SDK installs from PyPI. The other six Exsited SDKs are installed from their source repositories rather than from a package registry such as npm or NuGet. This article explains what you need and how installation works. The developer documentation has the exact commands for each language.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/installation\" style=\"font-weight: 700;\">See the installation guide<\/a><\/p>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Before you start<\/p>\n  <p style=\"margin: 0;\">For every SDK except Python you need read access to the SDK repositories on Bitbucket. If you do not have it, ask your Exsited contact.<\/p>\n<\/div>\n\n<h2 style=\"margin: 32px 0 12px;\">Python<\/h2>\n\n<p style=\"margin: 0 0 16px;\">Run <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pip install \"exsited&gt;=4,&lt;5\"<\/code>. It needs Python 3.10 or newer, and the import is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">exsited<\/code>.<\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">The other six SDKs<\/h2>\n\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">1<\/span><strong>Clone the SDK's repository.<\/strong> Use the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">development<\/code> branch; it is the main branch.<\/p>\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">2<\/span><strong>Run one command in the clone<\/strong> to install its dependencies or build it, for example <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">npm install<\/code> for JavaScript. The table below lists the command for each language.<\/p>\n<p style=\"margin: 0 0 10px;\"><span style=\"display: inline-block; min-width: 1.6em; font-weight: 700;\">3<\/span><strong>Point your project at the clone.<\/strong> Keep the clone next to your project, because the paths are relative.<\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">What each SDK needs<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Language<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You need<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Command<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>Python<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Python 3.10 or newer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pip install \"exsited&gt;=4,&lt;5\"<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>JavaScript<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Node.js 18.17 or newer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">npm install<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>PHP<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">PHP 8.2 or newer and Composer 2<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">composer install<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>Java<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">JDK 21 and Maven 3.9 or newer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">mvn install -DskipTests<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>.NET<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">.NET SDK 8.0.100 or newer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">dotnet pack<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>Dart<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Dart 3.5 or newer (included with Flutter)<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">dart pub get<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><strong>Go<\/strong><\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Go 1.24 or newer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">go build ./...<\/code><\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Keeping the SDK up to date<\/h2>\n\n<p style=\"margin: 0 0 16px;\">For Python, run <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pip install -U \"exsited&gt;=4,&lt;5\"<\/code>. For the others, run <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">git pull<\/code> in the clone. JavaScript, PHP, Dart and Go pick up the change straight away. Java and .NET use a built copy, so run the command in the clone again after you pull.<\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Troubleshooting<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">The SDK files are missing after cloning<\/h3>\n<p style=\"margin: 0 0 16px;\">The clone is on the wrong branch. Clone again with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">--branch development<\/code>; the repository's default branch does not hold the SDK.<\/p>\n\n<h3 style=\"margin: 24px 0 8px;\">Java cannot find the SDK<\/h3>\n<p style=\"margin: 0 0 16px;\">An error such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">Could not find artifact com.exsited:exsited-sdk<\/code> means the build step was skipped. Run <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">mvn install -DskipTests<\/code> in the clone, then build your project again. No extra repository or registry login is needed.<\/p>\n\n<h3 style=\"margin: 24px 0 8px;\">.NET cannot find the package<\/h3>\n<p style=\"margin: 0 0 16px;\">There is no public feed. Run <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">dotnet pack<\/code> in the clone and add its output folder as a package source, as the installation guide shows.<\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the Exsited API<\/li>\n<\/ul>\n", "size": 9559}, {"file": "03-accounts.html", "title": "Working with accounts through the API", "subtitle": "Create and manage customers and suppliers, their contacts, groups and messages", "summary": "The 77 endpoints for accounts, account emails, account groups, communications and communication profiles, the tasks they cover and what to watch for.", "area": "Accounts", "html": "<p style=\"margin: 0 0 16px;\">The Accounts APIs let your software work with the customers and suppliers you bill and buy from. You can create, read, change, cancel and delete accounts, manage their contacts, addresses, payment methods, billing preferences and notes, and list the orders, invoices, payments and other records that belong to each account. You can also sort accounts into groups, manage communication profiles and email documents such as invoices and account statements. All seventy-seven endpoints are available in all seven Exsited SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/accounts\" style=\"font-weight: 700;\">Open the Accounts reference<\/a>&nbsp;&nbsp;&nbsp;&nbsp;<a href=\"https://exsited.mintlify.app/communications\" style=\"font-weight: 700;\">Open the Communications reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a new customer or supplier<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/create-an-account\">Create an account<\/a> with a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">type<\/code> of <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CUSTOMER<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">SUPPLIER<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CUSTOMER_AND_SUPPLIER<\/code>, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Find accounts by email address or creation date<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/list-accounts\">List accounts<\/a> with a filter such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">filter_email_address_contains<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">filter_created_on_gte<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Change a few of an account's details<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/update-an-accounts-information\">Update an account's information<\/a>, sending only the fields to change inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a contact person to an account<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/add-contacts-to-an-account\">Add contacts to an account<\/a>, giving each contact its slot, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CONTACT_1<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CONTACT_5<\/code>, as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">type<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Save a payment method on an account<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/add-a-payment-method\">Add a payment method<\/a> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">processor_type<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment_processor<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">reference<\/code>. The first method you add becomes the account's default<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Close an account from a date, or open it again<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/cancel-an-account\">Cancel an account<\/a> with an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">effective_date<\/code>, then <a href=\"https://exsited.mintlify.app/api-reference/accounts/reactivate-an-account\">Reactivate an account<\/a> with the same body when you need it back<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">See the invoices that belong to one account<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/list-an-accounts-invoices\">List an account's invoices<\/a>, page by page<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Email an invoice or an account statement to a customer<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communications/email-a-document\">Email a document<\/a>, naming the document and the recipients in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">to<\/code><\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Accounts<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints create, read, change, cancel and delete accounts and manage their contacts, addresses, payment methods, billing preferences, notes, image and emails, and the <a href=\"https://exsited.mintlify.app/accounts\">Accounts overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/list-accounts\">List accounts<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists your accounts a page at a time, with optional filters and sorting.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/accounts<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/retrieve-an-account\">Retrieve an account<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one account with its contacts, addresses, payment methods and billing preferences.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/accounts/{account_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/retrieve-an-accounts-information\">Retrieve an account's information<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns an account's core information, under account.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: x; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/account_groups/{account_group_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/account-groups/update-an-account-group\">Update an account group<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes an account group's fields or its status.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/account_groups/{account_group_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Communications<\/h3>\n\n<p style=\"margin: 0 0 16px;\">This endpoint emails one invoice, purchase invoice, account statement or payment to the recipients you name, and the <a href=\"https://exsited.mintlify.app/communications\">Communications overview<\/a> explains it.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communications/email-a-document\">Email a document<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Emails one invoice, purchase invoice, account statement or payment.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communications/send_email<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Communication profiles<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints list, create, read, update and delete the communication profiles that hold the messages and channel settings accounts use, and the <a href=\"https://exsited.mintlify.app/communication-profiles\">Communication profiles overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communication-profiles/list-communication-profiles\">List communication profiles<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists your communication profiles, a page at a time.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communication_profiles<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communication-profiles/create-a-communication-profile\">Create a communication profile<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates a communication profile and returns it under communication_profile.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communication_profiles<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communication-profiles/retrieve-a-communication-profile\">Retrieve a communication profile<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one communication profile, under communication_profile.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communication_profiles/{communication_profile_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communication-profiles/delete-a-communication-profile\">Delete a communication profile<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes a communication profile that is not the default.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communication_profiles/{communication_profile_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/communication-profiles/update-a-communication-profile\">Update a communication profile<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes a communication profile's fields and channel settings.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/communication_profiles/{communication_profile_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Purging an account cannot be undone, and emails are real<\/p>\n  <p style=\"margin: 0;\"><a href=\"https://exsited.mintlify.app/api-reference/accounts/purge-an-account\">Purge an account<\/a> removes the account and its records permanently. If you only want to stop working with an account, use <a href=\"https://exsited.mintlify.app/api-reference/accounts/cancel-an-account\">Cancel an account<\/a> instead. <a href=\"https://exsited.mintlify.app/api-reference/communications/email-a-document\">Email a document<\/a> and <a href=\"https://exsited.mintlify.app/api-reference/accounts/send-and-log-an-email\">Send and log an email<\/a> send real email to the recipients you name, so use addresses you control when you try them.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Paths take the account's id, not its uuid<\/p>\n  <p style=\"margin: 0;\">Every account path names the account by its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>, a short code such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">W13ZGY<\/code>. Passing the account's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">uuid<\/code> returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code>.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Most writes put their fields inside one key.<\/strong> Account writes use <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account<\/code>, a single address <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">address<\/code>, a contact <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">contact<\/code>, a payment method <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment_method<\/code> and billing preferences <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">billing_preferences<\/code>. Setting a portal password and sending an email take their fields at the top level, and adding addresses takes a top-level <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">addresses<\/code> list.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A contact is read by its slot and changed by its id.<\/strong> <a href=\"https://exsited.mintlify.app/api-reference/accounts/retrieve-a-contact-by-slot\">Retrieve a contact by slot<\/a> takes <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CONTACT_1<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CONTACT_5<\/code>; updating, replacing and deleting a contact take its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">con_<\/code> id. A contact created as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">CONTACT_1<\/code> reads back with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">type<\/code> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">billing<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Some fields are written one way and read back another.<\/strong> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">currency<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">time_zone<\/code> go in as a code and a name and read back as objects, an address is written with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">post_code<\/code> and reads back with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">postal_code<\/code>, and a contact's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">first_name<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">last_name<\/code> read back under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>An account with orders, invoices or payments cannot be deleted.<\/strong> <a href=\"https://exsited.mintlify.app/api-reference/accounts/delete-an-account\">Delete an account<\/a> returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">409<\/code> for it, and retrying does not help.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Lists come a page at a time.<\/strong> Records come under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">data<\/code> with a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination<\/code> object. While <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">has_more<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>, send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.next_cursor<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">cursor<\/code> to get the next page.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Only unused groups and non-default profiles can be deleted.<\/strong> An account group can be deleted only when no account uses it, and the default communication profile cannot be deleted.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the Exsited API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the Exsited SDKs<\/li>\n<\/ul>\n", "size": 100685}, {"file": "04-sales.html", "title": "Working with orders, invoices and payments through the API", "subtitle": "Take orders, bill for them and record the money that comes in or goes back", "summary": "The 165 endpoints for orders, quotes, usage, invoices, payments, credit notes, refunds and gift certificates, the tasks they cover and what to watch for.", "area": "Sales", "html": "<p style=\"margin: 0 0 16px;\">The sales APIs let your software handle what your accounts buy and pay for. You can create and change orders, quotes and contracts, record usage on metered lines, raise and amend invoices and pro-forma invoices, record payments, issue credit notes and refunds, and manage gift certificates and sales reps. You can also read credit note applications and the payments and refunds in a bank reconciliation. All one hundred and sixty-five endpoints are available in all seven Exsited SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/orders\" style=\"font-weight: 700;\">Open the Orders reference<\/a>&nbsp;&nbsp;&nbsp;&nbsp;<a href=\"https://exsited.mintlify.app/invoices\" style=\"font-weight: 700;\">Open the Invoices reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Take an order for an account<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/create-an-order\">Create an order<\/a> with the account's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account_id<\/code> and at least one line naming an item, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">order<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Create an active order and its invoice in one call<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/express/create-an-express-order\">Create an express order<\/a>, naming the account by <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> and putting the order under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account.order<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Check the price of an order before you create it<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/preview-an-order\">Preview an order<\/a> with the same body as a new order. No order is created<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Turn an accepted quote into an order<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/convert-a-quote-to-an-order\">Convert a quote to an order<\/a> with an empty body. The new order has its own <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Record how much of a metered item a customer used<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/usages/create-usages\">Create usages<\/a> with the order line's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">charge_item_id<\/code> and the billing period as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">charging_period<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add, change or remove lines on an invoice<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/invoices/amend-an-invoice\">Amend an invoice<\/a>, giving each entry in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">invoice.lines<\/code> an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">op<\/code> of <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">add<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">change<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">remove<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Record a payment against one or more invoices<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/payments/create-a-payment\">Create a payment<\/a> with the invoices it pays and the money received, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Credit an invoice, then pay the credit back<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/credit-notes/create-a-credit-note\">Create a credit note<\/a> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">invoice_id<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">amount<\/code>, then <a href=\"https://exsited.mintlify.app/api-reference/refunds/create-a-refund-from-a-credit-note\">Create a refund from a credit note<\/a> with an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">amount<\/code> and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment_method<\/code><\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Orders<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints create and read orders, quotes and contracts, change their lines and billing, move them through their states and manage their notes and files, and the <a href=\"https://exsited.mintlify.app/orders\">Orders overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/list-orders\">List orders<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists orders, one page at a time.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/orders<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/create-an-order\">Create an order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates an order for an account and returns it under order.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/orders<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/retrieve-an-order\">Retrieve an order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one order with its lines, totals and KPIs, under order.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/orders/{order_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/orders/delete-an-order\">Delete an order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes an order and returns no content.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display
