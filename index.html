>…/return_merchandise_authorisations/{rma_code}/notes<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-merchandise-authorisations/retrieve-an-rma-note\">Retrieve an RMA note<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one note of an RMA under note.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_merchandise_authorisations/{rma_code}/notes/{note_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-merchandise-authorisations/list-rma-note-files\">List RMA note files<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists the attachments of one RMA note.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_merchandise_authorisations/{rma_code}/notes/{note_id}/files<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-merchandise-authorisations/retrieve-an-rma-note-file\">Retrieve an RMA note file<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one attachment of an RMA note under file.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_merchandise_authorisations/{rma_code}/notes/{note_id}/files/{file_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-merchandise-authorisations/list-an-rmas-receipts\">List an RMA's receipts<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists the stock receipts of an RMA, one page at a time.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_merchandise_authorisations/{rma_code}/receive<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-merchandise-authorisations/retrieve-an-rma-receipt\">Retrieve an RMA receipt<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one stock receipt of an RMA under receive_rma.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_merchandise_authorisations/{rma_code}/receive/{receive_uuid}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Deleting a booking deletes any order with that id<\/p>\n  <p style=\"margin: 0;\"><a href=\"https://exsited.mintlify.app/api-reference/bookings/delete-a-booking\">Delete a booking<\/a> removes whatever order has the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> you send, of any type, so check the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> first. Stock that has moved also locks records: a fulfillment cannot be deleted once any of its stock has been sent, a completed item receipt cannot be deleted, and only a draft return merchandise authorisation can be deleted. These deletes are refused with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> and the code <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">stock_committed<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Address an item by its id code<\/p>\n  <p style=\"margin: 0;\">Item paths take the item's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">ITEM-0001<\/code>. Do not use its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">uuid<\/code>, or the integer <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> that <a href=\"https://exsited.mintlify.app/api-reference/items/retrieve-an-items-sale-settings\">Retrieve an item's sale settings<\/a> and <a href=\"https://exsited.mintlify.app/api-reference/items/retrieve-an-items-purchase-settings\">Retrieve an item's purchase settings<\/a> return.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Every item write sits under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">item<\/code>.<\/strong> The one exception is <a href=\"https://exsited.mintlify.app/api-reference/items/upload-an-items-image\">Upload an item's image<\/a>, which sends <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">image_base64<\/code> at the top level of a JSON body.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>An item that an order uses cannot be deleted.<\/strong> <a href=\"https://exsited.mintlify.app/api-reference/items/delete-an-item\">Delete an item<\/a> returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">409<\/code> for it, and retrying does not help.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Stock quantities are strings.<\/strong> In inventory adjustments, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">adjustment_amount<\/code> and every <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">quantity_*<\/code> field arrive as text, so convert them before doing arithmetic.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A shipping rule names a zone by its dashed uuid.<\/strong> Take the 32 hex digits after <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">zn_<\/code> in the zone's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> and group them 8-4-4-4-12. In the same way, a shipping package's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">*_uom<\/code> fields take a unit's bare uuid, not its prefixed <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Return merchandise authorisation writes take the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">rma_<\/code> id; the reads under it take the code.<\/strong> The note and receipt reads return <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> for an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">rma_<\/code> id.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Lists come a page at a time.<\/strong> Records come under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">data<\/code>. Send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">limit<\/code>, then pass <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.next_cursor<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">cursor<\/code> until <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">has_more<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">false<\/code>.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the Exsited API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the Exsited SDKs<\/li>\n<\/ul>\n", "size": 188427}, {"file": "06-purchasing.html", "title": "Working with purchasing through the API", "subtitle": "Order from suppliers, record their bills and pay them", "summary": "The 89 endpoints for purchase orders, purchase invoices, purchase payments, credits, refunds and returns to suppliers, the tasks they cover and what to watch for.", "area": "Purchasing", "html": "<p style=\"margin: 0 0 16px;\">The purchasing APIs let your software handle what you buy from your suppliers. You can create, change, cancel and read purchase orders, record supplier bills as purchase invoices, pay suppliers, and track the credit a supplier owes you through purchase credit notes and refunds. You can also send purchased stock back to a supplier, generate ABA files from purchase payments and set up receive terms. All eighty-nine endpoints are available in all seven Exsited SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/purchase-orders\" style=\"font-weight: 700;\">Open the Purchase orders reference<\/a>&nbsp;&nbsp;&nbsp;&nbsp;<a href=\"https://exsited.mintlify.app/purchase-payments\" style=\"font-weight: 700;\">Open the Purchase payments reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Order goods from a supplier<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/create-a-purchase-order\">Create a purchase order<\/a> with the supplier's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account_id<\/code> and its lines, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_order<\/code>. Send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"draft\": true<\/code> to save it as a draft<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add or change lines on a purchase order<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/change-a-purchase-orders-lines\">Change a purchase order's lines<\/a>, giving each entry an <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">op<\/code> of <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">add<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">change<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Record the supplier's bill for a purchase order<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/create-a-purchase-invoice-from-a-purchase-order\">Create a purchase invoice from a purchase order<\/a> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">{\"purchase_invoice\": {}}<\/code> as the body<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Pay one purchase invoice<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-payments/create-a-purchase-payment-for-a-purchase-invoice\">Create a purchase payment for a purchase invoice<\/a>, sending only <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment_method_applications<\/code> inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_payment<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Create a purchase order and its bill and payment in one call<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-express/create-a-purchase-order-in-one-call\">Create a purchase order in one call<\/a>, with the supplier in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account.id<\/code> and the order in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">account.purchase_order<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Record money a supplier pays back<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-refunds/create-a-purchase-refund-from-a-purchase-credit-note\">Create a purchase refund from a purchase credit note<\/a>, with the reference of one of the supplier's payment methods as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">payment_method<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Send purchased stock back to a supplier<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-vendor-authorizations/create-a-return-vendor-authorization\">Create a return vendor authorization<\/a>, naming the purchase order and each line with the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">rva_qty<\/code> to return<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Build an ABA file from purchase payments<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/aba-files/generate-an-aba-file\">Generate an ABA file<\/a>, listing each payment's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">aba_file.transactions<\/code><\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Purchase orders<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints create, update, change, cancel and reactivate purchase orders, read their lines, KPIs, purchase invoices and payments and manage their notes and files, and the <a href=\"https://exsited.mintlify.app/purchase-orders\">Purchase orders overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/list-purchase-orders\">List purchase orders<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one page of purchase orders.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/purchase_orders<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/create-a-purchase-order\">Create a purchase order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates a purchase order for a supplier and returns it under purchase_order.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/purchase_orders<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/list-notes-across-purchase-orders\">List notes across purchase orders<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one page of notes from every purchase order.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/purchase_orders/notes<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/delete-a-purchase-order\">Delete a purchase order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes a purchase order. Nothing comes back.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/purchase_orders/{purchase_order_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/update-a-purchase-order\">Update a purchase order<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes header fields of a purchase order and returns it under purchase_order.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/purchase_orders/{purchase_order_id}<\/c ing: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-vendor-authorizations/delete-a-return-vendor-authorization-note\">Delete a return vendor authorization note<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes one note from a return vendor authorization. Nothing comes back.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_vendor_authorizations/{rva_id}/notes/{note_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-vendor-authorizations/delete-a-return-vendor-authorization-note-file\">Delete a return vendor authorization note file<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Removes one attachment from a return vendor authorization note. Nothing comes back.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_vendor_authorizations/{rva_id}/notes/{note_id}/files/{file_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-vendor-authorizations/list-return-vendor-authorizations\">List return vendor authorizations<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one page of return vendor authorizations.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_vendor_authorizations<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/return-vendor-authorizations/retrieve-a-return-vendor-authorization\">Retrieve a return vendor authorization<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one return vendor authorization with its lines under return_vendor_authorization.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/return_vendor_authorizations/{rva_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">ABA files<\/h3>\n\n<p style=\"margin: 0 0 16px;\">This endpoint generates an ABA file from the transactions you name, such as purchase payments, and the <a href=\"https://exsited.mintlify.app/aba-files\">ABA files overview<\/a> explains it.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/aba-files/generate-an-aba-file\">Generate an ABA file<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Generates an ABA file from the transactions you name.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/aba_file/generate<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h3 style=\"margin: 24px 0 8px;\">Receive terms<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints create, list, read, update, enable, disable and delete the receive terms in your settings, and the <a href=\"https://exsited.mintlify.app/receive-terms\">Receive terms overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/receive-terms/list-receive-terms\">List receive terms<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one page of receive terms.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/receive_terms<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/receive-terms/create-a-receive-term\">Create a receive term<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Creates a receive term and returns it under receive_term.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e8f0fe; color: #1c5fd0;\">POST<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/receive_terms<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/receive-terms/retrieve-a-receive-term\">Retrieve a receive term<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Returns one receive term under receive_term.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/receive_terms/{receive_term_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/receive-terms/delete-a-receive-term\">Delete a receive term<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Deletes a receive term. Nothing comes back.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/receive_terms/{receive_term_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/receive-terms/update-a-receive-term\">Update a receive term<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Changes a receive term, or enables or disables it, and returns it under receive_term.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/receive_terms/{receive_term_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Deletes cannot be undone, so cancel when you can<\/p>\n  <p style=\"margin: 0;\">Deleting a purchase order, purchase invoice, purchase payment, purchase refund or purchase credit note, or one of their notes or files, cannot be undone. If you may need a purchase order or purchase invoice again, cancel it instead: <a href=\"https://exsited.mintlify.app/api-reference/purchase-orders/cancel-a-purchase-order\">Cancel a purchase order<\/a> and <a href=\"https://exsited.mintlify.app/api-reference/purchase-invoices/cancel-a-purchase-invoice\">Cancel a purchase invoice<\/a> set the status to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">inactive<\/code>, and the reactivate calls set it back to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">active<\/code>. Only a draft return vendor authorization can be deleted; any other status returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">stock_committed<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Overpaying a supplier raises a purchase credit note<\/p>\n  <p style=\"margin: 0;\">A purchase payment that pays more than its invoices take raises a purchase credit note. <a href=\"https://exsited.mintlify.app/api-reference/purchase-payments/list-a-purchase-payments-purchase-credit-notes\">List a purchase payment's purchase credit notes<\/a> shows it. Applying a purchase credit note to purchase invoices in turn records a purchase payment.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Each record type has its own wrapper key.<\/strong> Write bodies go inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_order<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_invoice<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_payment<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_refund<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">purchase_credit_note<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">return_vendor_authorization<\/code>. The cancel and reactivate calls take an empty object.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Purchase order note calls take the purchase order's code, not its id.<\/strong> That covers listing, creating, reading and deleting notes and their files.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Some calls take only the prefixed id.<\/strong> The purchase credit note apply, note and delete calls take the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pcn_<\/code> id, and deleting a return vendor authorization takes the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">rva_<\/code> id. The reads accept either the id or the code.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Amounts are decimal strings.<\/strong> Send purchase payment amounts as text, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">\"1.00\"<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A purchase refund's amount cannot change.<\/strong> <a href=\"https://exsited.mintlify.app/api-reference/purchase-refunds/update-a-purchase-refund\">Update a purchase refund<\/a> takes only <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">alternate_date<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">reference<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">note<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">custom_attributes<\/code>; any other key returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">400<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Lists come a page at a time.<\/strong> Records come under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">data<\/code>. While <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.has_more<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>, send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.next_cursor<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">cursor<\/code> to get the next page.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the Exsited API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the Exsited SDKs<\/li>\n<\/ul>\n", "size": 119748}, {"file": "07-work-and-people.html", "title": "Working with work and people through the API", "subtitle": "Manage the people you book, the work they do and the time they spend", "summary": "The 69 endpoints for labours, tasks, timesheets, milestones, employees, departments, designations, teams and time periods, the tasks they cover and what to watch for.", "area": "Work and people", "html": "<p style=\"margin: 0 0 16px;\">The work and people APIs let your software manage the people and resources you book, the work they do and the time they spend on it. You can manage labours and labour profiles, set their availability and find labours free to book, create tasks with checklists and notes, record timesheets against booked order lines and read milestones. You can also manage employees, designations, teams and time periods, and read your departments. All sixty-nine endpoints are available in all seven Exsited SDKs.<\/p>\n\n<p style=\"margin: 0 0 24px;\"><a href=\"https://exsited.mintlify.app/labours\" style=\"font-weight: 700;\">Open the Labours reference<\/a>&nbsp;&nbsp;&nbsp;&nbsp;<a href=\"https://exsited.mintlify.app/tasks\" style=\"font-weight: 700;\">Open the Tasks reference<\/a><\/p>\n\n<h2 style=\"margin: 32px 0 12px;\">Common tasks<\/h2>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\">\n  <thead>\n    <tr>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">You want to<\/th>\n      <th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Use<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Set up the prices and sessions for a kind of labour<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/create-a-labour-profile\">Create a labour profile<\/a> with at least one entry in <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labour_profile_sessions<\/code>, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labour_profile<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a person or resource you can book<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/create-a-labour\">Create a labour<\/a> with its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">display_name<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">email_address<\/code> and the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> of its profile as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labour_profile<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Find who is free to book in a time window<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/list-labours-available-for-booking\">List labours available for booking<\/a> with <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">start_date<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">end_date<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">YYYY-MM-DD HH:MM<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Set the hours several labours are available<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/update-labour-availability-in-bulk\">Update labour availability in bulk<\/a>, with one entry per labour under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labours<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Create a task with a checklist<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/tasks/create-a-task\">Create a task<\/a> with a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code> inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">work_task<\/code>, then <a href=\"https://exsited.mintlify.app/api-reference/tasks/add-checklist-items-to-a-task\">Add checklist items to a task<\/a><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Record time worked on a booking<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/timesheets/create-a-timesheet\">Create a timesheet<\/a> with the booked line as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">sale_order_item<\/code> and a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">start_time<\/code> and <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">end_time<\/code> in UTC<\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">Add a staff member<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/employees/create-an-employee\">Create an employee<\/a> with at least a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">name<\/code>, inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">employee<\/code><\/td>\n    <\/tr>\n    <tr>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\">See the milestones for one employee<\/td>\n      <td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/milestones/list-an-employees-milestones\">List an employee's milestones<\/a> with the employee's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code<\/code>, not its <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">emp_<\/code> id<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">All endpoints<\/h2>\n\n<h3 style=\"margin: 24px 0 8px;\">Labours<\/h3>\n\n<p style=\"margin: 0 0 16px;\">These endpoints manage labours and labour profiles with their sessions, availability and booking windows and list the orders that book a labour, and the <a href=\"https://exsited.mintlify.app/labours\">Labours overview<\/a> explains each one.<\/p>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid #dfe3eb;\"><thead><tr><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Endpoint<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Method<\/th><th style=\"text-align: left; font-weight: 700; padding: 8px 12px; background-color: #f5f8fa; border-bottom: 1px solid #dfe3eb;\">Path<\/th><\/tr><\/thead><tbody><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/list-labour-availability\">List labour availability<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists each labour with its schedule and sessions for a date range.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">/labour_availability<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/labours/list-labour-profiles\">List labour profiles<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Lists labour profiles, one page at a time.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #e5f5f0; color: #0b7a5f;\">GET<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px
