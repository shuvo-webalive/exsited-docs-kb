ding: 3px 8px; border-radius: 4px; background-color: #fde9e7; color: #b42318;\">DELETE<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/time_periods/{time_period_id}<\/code><\/td><\/tr><tr><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><a href=\"https://exsited.mintlify.app/api-reference/time-periods/update-a-time-period\">Update a time period<\/a><br><span style=\"font-size: 14px; color: #516f90;\">Updates a time period's details, or enables or disables it.<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top; white-space: nowrap;\"><span style=\"display: inline-block; min-width: 58px; text-align: center; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 4px; background-color: #f1edfe; color: #6941c6;\">PATCH<\/span><\/td><td style=\"padding: 8px 12px; border-bottom: 1px solid #dfe3eb; vertical-align: top;\"><code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">…/time_periods/{time_period_id}<\/code><\/td><\/tr><\/tbody><\/table>\n\n<h2 style=\"margin: 32px 0 12px;\">Good to know<\/h2>\n\n<div style=\"background-color: #fdf8ee; border-left: 3px solid #c98a00; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Deletes cannot be undone, and some records are locked<\/p>\n  <p style=\"margin: 0;\">Deleting a labour, labour profile, task, timesheet, employee, designation, team or time period cannot be undone; reading it afterwards returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code>. A labour that has been booked on an order cannot be deleted, so use <a href=\"https://exsited.mintlify.app/api-reference/labours/cancel-a-labour\">Cancel a labour<\/a> instead. A team with members cannot be deleted until you remove them, and a checklist item whose status is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">COMPLETED<\/code> cannot be deleted and returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">409<\/code>.<\/p>\n<\/div>\n\n<div style=\"background-color: #f0f6fb; border-left: 3px solid #2f7ebc; padding: 12px 16px; margin: 0 0 20px;\">\n  <p style=\"font-weight: 700; margin: 0 0 4px;\">Some paths take a code instead of an id<\/p>\n  <p style=\"margin: 0;\">Task note paths take the task's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code<\/code>; a <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">wt_<\/code> id returns <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">404<\/code> there, while the task, checklist and update calls take the <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">wt_<\/code> id. <a href=\"https://exsited.mintlify.app/api-reference/labours/list-a-labours-orders\">List a labour's orders<\/a> takes the labour's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code<\/code>, and <a href=\"https://exsited.mintlify.app/api-reference/milestones/list-an-employees-milestones\">List an employee's milestones<\/a> takes the employee's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">code<\/code>.<\/p>\n<\/div>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\"><strong>Each record type has its own wrapper key.<\/strong> Bodies go inside <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labour<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">labour_profile<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">work_task<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">timesheet<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">employee<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">designation<\/code>, <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">team<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">time_period<\/code>, and the single record comes back under the same key.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>A timesheet belongs to a booked order line.<\/strong> <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">sale_order_item<\/code> is the line's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">ln_<\/code> id with the prefix changed to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">soi_<\/code>, on a line that books a labour. Send times such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">2026-11-09T09:00:00Z<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Cancel and reactivate a labour with an empty JSON object.<\/strong> Cancel sets <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">status<\/code> to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">inactive<\/code> and reactivate sets it to <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">active<\/code>.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Teams and time periods are turned on and off through <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">status<\/code>.<\/strong> Send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">active<\/code> or <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">inactive<\/code> in an update. A time period's <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">period<\/code> goes in upper case, such as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">MONTHLY<\/code>, and comes back in lower case.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Milestones and departments are read only.<\/strong> These areas have no create, update or delete call, and a department listed with a null <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">id<\/code> cannot be retrieved on its own.<\/li>\n  <li style=\"margin: 0 0 6px;\"><strong>Lists come a page at a time.<\/strong> Records come under <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">data<\/code>. While <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.has_more<\/code> is <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">true<\/code>, send <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">pagination.next_cursor<\/code> as <code style=\"font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.9em; background-color: #f5f8fa; border: 1px solid #dfe3eb; border-radius: 3px; padding: 1px 4px;\">cursor<\/code> to get the next page.<\/li>\n<\/ul>\n\n<h2 style=\"margin: 32px 0 12px;\">Related articles<\/h2>\n\n<ul style=\"margin: 0 0 16px; padding-left: 24px;\">\n  <li style=\"margin: 0 0 6px;\">Getting started with the Exsited API<\/li>\n  <li style=\"margin: 0 0 6px;\">Installing the Exsited SDKs<\/li>\n<\/ul>\n", "size": 94501}]}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const copied = new Set(JSON.parse(sessionStorage.getItem('kb-copied') || '[]'));
  const logo = new URL('assets/exsited-logo.svg', location.href).href;
  const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  const entries = [{ kind: 'category', id: 'category', title: data.category.name, category: data.category }]
    .concat(data.articles.map(a => Object.assign({ kind: 'article', id: a.file }, a)));
  const buttons = [];
  let current = 1;

  document.getElementById('base').textContent = data.base;
  document.getElementById('placeholder').hidden = !data.placeholder;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function listButton(entry, index) {
    const button = document.createElement('button');
    button.type = 'button';
    button.innerHTML = '<span><span class="name"></span><span class="kind"></span></span>' + TICK;
    button.querySelector('.name').textContent = entry.title;
    button.querySelector('.kind').textContent = entry.kind === 'category' ? 'Category page' : data.category.name;
    button.classList.toggle('copied', copied.has(entry.id));
    button.addEventListener('click', () => show(index));
    const item = document.createElement('li');
    item.appendChild(button);
    buttons[index] = button;
    return item;
  }

  entries.forEach((entry, index) => {
    document.getElementById(entry.kind === 'category' ? 'category-list' : 'articles').appendChild(listButton(entry, index));
  });

  function countLabel(shown) {
    const total = data.articles.length;
    return shown === total ? total + (total === 1 ? ' article' : ' articles') : shown + ' of ' + total + ' articles';
  }
  document.getElementById('count').textContent = countLabel(data.articles.length);

  const KB_CSS = `
    *{box-sizing:border-box}
    body{margin:0;font-family:"Open Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#333;background:#fff}
    a{color:#c75b17;text-decoration:none}
    a:hover{text-decoration:underline}
    .kb-top{display:flex;align-items:center;justify-content:space-between;padding:22px 32px}
    .kb-brand{display:flex;align-items:flex-end;gap:10px}
    .kb-brand img{height:34px}
    .kb-brand span{font-size:15px;color:#555;padding-bottom:2px}
    .kb-go{background:#f47521;color:#fff;font-weight:600;font-size:15px;padding:10px 20px;border-radius:999px}
    .kb-go:hover{text-decoration:none;background:#c75b17}
    .kb-hero{background:#f2f2f2;padding:56px 32px 60px}
    .kb-hero-in{max-width:1000px;margin:0 auto}
    .kb-hero h2{margin:0 0 16px;font-size:34px;line-height:1.2;font-weight:700;color:#222}
    .kb-search{display:flex;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .kb-search input{flex:1;border:0;padding:12px 14px;font:inherit;font-size:15px;color:#333;outline:none}
    .kb-search span{width:40px;display:grid;place-items:center;background:#e6eaee;color:#333}
    .kb-wrap{max-width:1000px;margin:0 auto;padding:0 0 32px}
    .kb-crumbs{padding:16px 0 28px;font-size:15px}
    .kb-crumbs .sep{color:#555;margin:0 10px}
    .kb-cols{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0}
    .kb-side{padding-right:24px;border-right:1px solid #e5e5e5}
    .kb-side a{display:block;padding:9px 10px;font-size:15px}
    .kb-side a.on{background:#fdefe6;color:#b8501a}
    .kb-side .sub a{padding:6px 10px 6px 22px;font-size:14px;color:#555}
    .kb-side .sub a.on{background:none;color:#b8501a;font-weight:600}
    .kb-main{padding:0 0 0 32px;min-width:0}
    .kb-main h1{margin:0 0 6px;font-size:32px;line-height:1.35;font-weight:700;color:#333}
    .kb-sub{margin:0 0 22px;font-size:15px;font-style:italic;color:#666}
    .kb-body h2{font-size:22px;line-height:1.35;font-weight:600;color:#333}
    .kb-body h3{font-size:18px;line-height:1.4;font-weight:600;color:#333}
    .kb-body ul,.kb-body ol{padding-left:26px}
    .kb-body table{font-size:15px}
    .kb-help{display:flex;align-items:center;gap:14px;margin:36px 0 0;padding:18px 0;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;font-size:15px}
    .kb-help span{display:inline-block;padding:5px 22px;background:#e6eaee;border-radius:3px;font-size:13px}
    .kb-list{list-style:none;margin:18px 0 0;padding:0 0 18px;border-bottom:1px solid #e5e5e5}
    .kb-list li{margin:0 0 10px}
    .kb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:26px;border-top:1px solid #e5e5e5;font-size:14px;color:#555}
    .kb-foot nav{display:flex;gap:22px}
    .kb-foot nav a{color:#555}
  `;

  function kbPage(entry) {
    const cat = data.category;
    const sub = data.articles.map(a => '<a href="#"' + (entry.id === a.file ? ' class="on"' : '') + '>' + escapeHtml(a.title) + '</a>').join('');
    const crumbs = '<a href="#">Help Center</a><span class="sep">&gt;</span><a href="#">' + escapeHtml(cat.name) + '</a>'
      + (entry.kind === 'article' ? '<span class="sep">&gt;</span><span>' + escapeHtml(entry.title) + '</span>' : '');
    const main = entry.kind === 'category'
      ? '<h1>' + escapeHtml(cat.name) + '</h1><p>' + escapeHtml(cat.description) + '</p><ul class="kb-list">'
        + data.articles.map(a => '<li><a href="#">' + escapeHtml(a.title) + '</a></li>').join('') + '</ul>'
      : '<h1>' + escapeHtml(entry.title) + '</h1><p class="kb-sub">' + escapeHtml(entry.subtitle) + '</p><div class="kb-body">' + entry.html + '</div>'
        + '<div class="kb-help">Was this article helpful? <span>Yes</span><span>No</span></div>';
    return '<!doctype html><html><head><meta charset="utf-8"><base target="_blank">'
      + '<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">'
      + '<style>' + KB_CSS + '</style></head><body>'
      + '<header class="kb-top"><div class="kb-brand"><img src="' + logo + '" alt="Exsited"><span>Help Center</span></div><a class="kb-go" href="#">Go to Exsited</a></header>'
      + '<section class="kb-hero"><div class="kb-hero-in"><h2>How can we help?</h2><div class="kb-search"><input placeholder="Search" disabled><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span></div></div></section>'
      + '<div class="kb-wrap"><nav class="kb-crumbs">' + crumbs + '</nav><div class="kb-cols">'
      + '<aside class="kb-side"><a href="#" class="on">' + escapeHtml(cat.name) + '</a><div class="sub">' + sub + '</div></aside>'
      + '<main class="kb-main">' + main + '</main></div>'
      + '<footer class="kb-foot"><span>&copy; ' + new Date().getFullYear() + ' Exsited. All rights reserved.</span><nav><a href="#">Privacy</a><a href="#">Terms</a></nav></footer></div>'
      + '</body></html>';
  }

  function field(label, value, meta, copyLabel, copyValue, primary) {
    return '<div class="field"><dt>' + label + '</dt><dd>' + (value ? escapeHtml(value) : '') + (meta ? ' <span class="meta">' + escapeHtml(meta) + '</span>' : '') + '</dd>'
      + '<button type="button" class="copy' + (primary ? ' primary' : '') + '" data-copy="' + copyValue + '" data-label="' + copyLabel + '">' + COPY_ICON + '<span>' + copyLabel + '</span></button></div>';
  }

  function show(index) {
    current = index;
    const entry = entries[index];
    buttons.forEach((button, at) => button.setAttribute('aria-current', at === index ? 'true' : 'false'));
    document.getElementById('title').textContent = entry.title;
    const fields = document.getElementById('fields');
    const steps = document.getElementById('steps');
    if (entry.kind === 'category') {
      fields.innerHTML = field('Name', entry.category.name, '', 'Copy name', 'name', false)
        + field('Description', entry.category.description, '', 'Copy description', 'description', false);
      steps.innerHTML = '<li>In HubSpot, open <strong>Knowledge base settings</strong> and go to <strong>Categories</strong>.</li>'
        + '<li>Create a category and paste the <strong>name</strong> and <strong>description</strong>.</li>'
        + '<li>Save. Articles filed in this category are listed on its page automatically.</li>';
      document.getElementById('code').textContent = entry.category.name + '\n\n' + entry.category.description;
    } else {
      fields.innerHTML = field('Title', entry.title, '', 'Copy title', 'title', false)
        + field('Subtitle', entry.subtitle, '', 'Copy subtitle', 'subtitle', false)
        + field('Category', data.category.name, '', 'Copy category', 'categoryName', false)
        + field('Body', '', Math.max(1, Math.round(entry.size / 1024)) + ' KB of HTML', 'Copy HTML', 'html', true);
      steps.innerHTML = '<li>In HubSpot, create an article in <strong>' + escapeHtml(data.category.name) + '</strong>. Paste the <strong>title</strong> and <strong>subtitle</strong>.</li>'
        + '<li>In the body toolbar, open <strong>Source code</strong>.</li>'
        + '<li>Paste the <strong>HTML</strong>, save, then preview before you publish.</li>';
      document.getElementById('code').textContent = entry.html;
    }
    fields.querySelectorAll('.copy').forEach(button => button.addEventListener('click', () => copyField(button)));
    document.getElementById('status').textContent = '';
    document.getElementById('preview').srcdoc = kbPage(entry);
  }

  async function writeText(value) {
    try {
      await navigator.clipboard.writeText(value);
    } catch (error) {
      const clip = document.getElementById('clip');
      clip.value = value;
      clip.select();
      document.execCommand('copy');
    }
  }

  async function copyField(button) {
    const entry = entries[current];
    const key = button.dataset.copy;
    const value = key === 'categoryName' ? data.category.name
      : entry.kind === 'category' ? entry.category[key] : entry[key];
    await writeText(value);
    button.classList.add('done');
    button.querySelector('span').textContent = 'Copied';
    if (key === 'html') {
      copied.add(entry.id);
      sessionStorage.setItem('kb-copied', JSON.stringify([...copied]));
      buttons[current].classList.add('copied');
      document.getElementById('status').textContent = 'Copied. Paste it into the Source code view in HubSpot.';
    }
    setTimeout(() => {
      button.classList.remove('done');
      button.querySelector('span').textContent = button.dataset.label;
    }, 2000);
  }

  document.getElementById('preview').addEventListener('load', (event) => {
    const frame = event.target;
    const doc = frame.contentDocument;
    const fit = () => { frame.style.height = doc.documentElement.scrollHeight + 'px'; };
    fit();
    new ResizeObserver(fit).observe(doc.body);
    if (doc.fonts) doc.fonts.ready.then(fit);
  });

  function setView(source) {
    document.getElementById('frame').classList.toggle('source', source);
    document.getElementById('view-preview').setAttribute('aria-pressed', String(!source));
    document.getElementById('view-source').setAttribute('aria-pressed', String(source));
  }
  document.getElementById('view-preview').addEventListener('click', () => setView(false));
  document.getElementById('view-source').addEventListener('click', () => setView(true));

  document.getElementById('search').addEventListener('input', (event) => {
    const words = event.target.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let shown = 0;
    entries.forEach((entry, index) => {
      if (entry.kind !== 'article') return;
      const haystack = (entry.title + ' ' + entry.subtitle + ' ' + entry.summary).toLowerCase();
      const match = words.every(word => haystack.includes(word));
      buttons[index].parentElement.hidden = !match;
      if (match) shown += 1;
    });
    document.getElementById('count').textContent = countLabel(shown);
    document.getElementById('empty').hidden = shown !== 0;
  });

  show(current);
</script>
</body>
</html>
